services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: tmc, POSTGRES_USER: tmc, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} }
    volumes: ["postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    command: ["redis-server","--requirepass","${REDIS_PASSWORD}"]
  upload-manager:
    build: { context: ../.., dockerfile: apps/upload-manager/Dockerfile }
    network_mode: host
    env_file: ../../.env
    volumes: ["/media:/media:ro","telethon:/root/.config/telegram-media-cloud"]
  telegram-gateway:
    build: { context: ../.., dockerfile: apps/telegram-gateway/Dockerfile }
    network_mode: host
    env_file: ../../.env
    volumes: ["telethon:/root/.config/telegram-media-cloud"]
  prometheus:
    image: prom/prometheus
    volumes: ["../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["127.0.0.1:3000:3000"]
volumes: { postgres: {}, telethon: {} }
