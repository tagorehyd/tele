server { listen 127.0.0.1:8443 ssl http2; server_name gateway.internal; ssl_certificate /etc/ssl/tmc/fullchain.pem; ssl_certificate_key /etc/ssl/tmc/privkey.pem; location / { proxy_pass http://127.0.0.1:8082; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } }
